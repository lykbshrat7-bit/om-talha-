<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أبناء أم طلحة القديمة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; color: #333; }
        header { background-color: #2d5a27; color: white; padding: 20px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo-container { margin: 20px auto; max-width: 200px; }
        .logo-container img { width: 100%; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .container { max-width: 800px; margin: 20px auto; padding: 20px; }
        .card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .profile-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #2d5a27; margin-bottom: 10px; }
        .bank-img { width: 100%; border-radius: 10px; margin-top: 15px; cursor: pointer; }
        .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .gallery img { width: 100%; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .footer { text-align: center; padding: 20px; font-size: 0.9em; color: #666; }
        .btn-whatsapp { display: inline-block; background-color: #25d366; color: white; padding: 10px 25px; border-radius: 50px; text-decoration: none; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <h1>منصة أبناء أم طلحة القديمة</h1>
    <p>خدمات، عقارات، وتواصل اجتماعي</p>
</header>

<div class="container">
    <div class="card">
        <div class="logo-container">
            <img src="logo.jpg" alt="شعار المبادرة">
        </div>
        <img src="profile.png" alt="المشرف" class="profile-img">
        <h3>إشراف: سفير القوافي</h3>
        <p>نعمل معاً من أجل إعمار وتطوير منطقتنا</p>
        <a href="https://wa.me/249129642171" class="btn-whatsapp">تواصل عبر واتساب</a>
    </div>

    <div class="card">
        <h2>لدعم المبادرة والمشاريع</h2>
        <p>يمكنكم المساهمة عبر الحساب البنكي التالي:</p>
        <img src="bank_card.jpg" alt="بيانات بنك الخرطوم" class="bank-img">
    </div>

    <div class="card">
        <h2>معرض الصور والخواطر</h2>
        <div class="gallery">
            <img src="quote1.jpg" alt="حكمة 1">
            <img src="quote2.jpg" alt="حكمة 2">
        </div>
    </div>
</div>

<div class="footer">
    <p>جميع الحقوق محفوظة &copy; 2026 - منصة أم طلحة</p>
</div>

</body>
</html>
